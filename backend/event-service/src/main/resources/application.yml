server:
  port: 8082

spring:
  application:
    name: event-service
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

services:
  identity-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
  ai-url: ${AI_SERVICE_URL:http://localhost:8083}

# Ключи Яндекса: JS API остаётся на фронтенде, геокодер и маршруты вызываются отсюда.
yandex:
  geocoder-key: ${YANDEX_GEOCODER_KEY:d2666b62-953d-49cd-98d3-9a9bb57cd4b3}
  router-key: ${YANDEX_ROUTER_KEY:6d63d361-a038-44be-873a-bafb1c9c6be6}

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:${SPORT_DATA_DIR:./data}/sportdb;AUTO_SERVER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sportdb}
    username: ${DB_USER:sport}
    password: ${DB_PASSWORD:sport}
