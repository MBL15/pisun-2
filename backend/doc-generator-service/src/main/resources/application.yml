server:
  port: 8084

spring:
  application:
    name: doc-generator-service
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB

services:
  identity-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
  event-url: ${EVENT_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:${SPORT_DATA_DIR:./data}/sportdb;AUTO_SERVER=TRUE
    username: sa
    password:

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sportdb}
    username: ${DB_USER:sport}
    password: ${DB_PASSWORD:sport}
